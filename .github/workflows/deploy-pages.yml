name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署，排队中的旧任务取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 若 Pages 尚未启用则自动开启（公开仓库可用；私有仓库需付费计划）
          enablement: true

      - name: 构建站点
        run: node build.mjs

      - name: 校验构建产物
        run: |
          test -f site/index.html || { echo "构建未产出 site/index.html"; exit 1; }
          echo "页面数：$(find site -name '*.html' | wc -l)"
          echo "文件数：$(find site -type f | wc -l)"
          test -f site/robots.txt && echo "robots.txt 已生成"

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
